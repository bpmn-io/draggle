name: CI
on: [ push, pull_request ]
jobs:
  Build:

    strategy:
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
        node-version: [ 24 ]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Configure hosted browsers
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux)
            echo "CHROME_BIN=/usr/bin/google-chrome" >> "$GITHUB_ENV"
            echo "FIREFOX_BIN=/usr/bin/firefox" >> "$GITHUB_ENV"
            echo "GECKODRIVER_PATH=$GECKOWEBDRIVER/geckodriver" >> "$GITHUB_ENV"
            echo "CHROMEDRIVER_PATH=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"
            ;;
          macOS)
            echo "CHROME_BIN=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_ENV"
            echo "CHROMEDRIVER_PATH=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"
            ;;
          Windows)
            echo "CHROME_BIN=C:/Program Files/Google/Chrome/Application/chrome.exe" >> "$GITHUB_ENV"
            echo "CHROMEDRIVER_PATH=C:/SeleniumWebDrivers/ChromeDriver/chromedriver.exe" >> "$GITHUB_ENV"
            ;;
        esac
    - name: Build
      if: runner.os == 'Linux'
      env:
        HEADLESS: 1
        TEST_BROWSERS: chrome,firefox
      run: xvfb-run npm run all
    - name: Build
      if: runner.os != 'Linux'
      env:
        HEADLESS: 1
        TEST_BROWSERS: chrome
      run: npm run all
